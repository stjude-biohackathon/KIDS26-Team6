[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autocab"
version = "0.1.0"
description = "AutoCAB starter repository for drafting reusable AI agent skills from recurring workflows."
readme = "README.md"
# No upper bound. rapidocr-onnxruntime 1.4.4 *declares* python<3.13, which
# looked like it forced a cap -- but verified by running real OCR inference on
# both 3.12 and 3.14, it works identically on each. Capping would have locked
# teammates out of newer interpreters for a metadata claim that does not hold.
requires-python = ">=3.10"
license = { file = "LICENSE.md" }

dependencies = [
  # --- control plane, shared by the CLI, GUI and agent skill ---
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.26",
  # --- capture ---
  "mss>=9.0",                      # screenshots; pure ctypes, no system deps
  "Pillow>=10.0",                  # WebP encode + change-detection thumbnails
  "watchdog>=4.0",                 # filesystem triggers (git does the verifying)
  "imageio-ffmpeg>=0.5",           # bundles an ffmpeg binary; none is assumed present
  # --- OCR: the part a downstream LLM can actually read ---
  "rapidocr-onnxruntime>=1.3,<2",  # ONNX models ship inside the wheel: fully offline
  # Explicit, and it must stay explicit: rapidocr-onnxruntime depends on
  # `opencv-python`, which needs system libGL and fails with
  # `ImportError: libGL.so.1` on a headless Linux box, in CI, or on an HPC
  # login node. The headless wheel provides the same `cv2` module without that
  # dependency. Note both builds can end up installed together (rapidocr pulls
  # the GL one); they share the `cv2` package directory so whichever installs
  # last wins, and `wfrec doctor` reports a libGL failure with the fix if the
  # wrong one ends up on top. `pip install --force-reinstall
  # opencv-python-headless` resolves it.
  "opencv-python-headless>=4.8",
  "psutil>=5.9",                   # process names for window attribution
  "rich>=15.0",                    # readable terminal status tables
  "click>=8.1",                    # unified, nested AutoCAB command groups
  "tomli>=2; python_version < '3.11'",  # config.toml support on minimum Python
  # Markdown event details are rendered server-side and sanitized before the
  # browser receives them. markdown-it-py is already pulled in by Rich, but it
  # remains direct here because wfrec imports and relies on its public API.
  "markdown-it-py>=4.2",
  "nh3>=0.3.7",
  # --- local model PHI detection ---
  # GLiNER runs through its published ONNX graph. Using the graph directly
  # avoids pulling PyTorch and Transformers into every wfrec installation.
  "onnxruntime>=1.17",
  "tokenizers>=0.20",
  "huggingface-hub>=0.24",
  "numpy>=1.24",
  # Menu-bar (macOS) / system-tray (Windows) recording indicator. Skipped on
  # Linux for now: a working tray needs AppIndicator/GTK system packages pip
  # cannot install, so it would fail at runtime rather than install cleanly.
  "pystray>=0.19; sys_platform == 'darwin' or sys_platform == 'win32'",
]

[project.optional-dependencies]
# Native app window. Kept optional because pywebview's Linux backend needs
# PyGObject, which is sdist-only and requires a compiler plus GTK headers --
# an unacceptable install blocker for a hybrid team. Without it the UI opens
# in the system browser, which works everywhere.
gui = ["pywebview>=4.4"]
# Linux extras: X11 window titles and the Wayland desktop-portal screenshot path.
linux = ["python-xlib>=0.33; sys_platform == 'linux'", "jeepney>=0.8; sys_platform == 'linux'"]
# macOS window titles and Apple Vision OCR (faster than RapidOCR, no permission
# prompt). NOT pywinctl, which pulls the entire pyobjc meta-package.
macos = [
  "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
  "ocrmac>=1.0; sys_platform == 'darwin'",
]
# --- de-identification ---
# The regex tier needs nothing: it is stdlib only, always on, and the only tier
# that runs inline at capture. That is what lets `SensitiveDataRedactor`
# delegate to `find_spans()` without making any of the below a hard requirement.
#
# GLiNER's runtime libraries are base dependencies, but its 183 MB weights are
# not. Users opt into the model tier with `wfrec deid fetch`; ordinary installs
# and the default regex redaction path never download model data.
deid-torch = ["torch>=2.2", "transformers>=4.40"]
# Experimental PII-tuned GLiNER2 evaluation. The base install keeps the much
# smaller ONNX engine; this extra brings in PyTorch only when explicitly chosen.
deid-gliner2 = ["gliner2[local]>=2.0,<3"]
# Presidio's *validators* are already adopted (see engines/validators.py); the
# framework is opt-in because `en_core_web_lg` is not on PyPI and installs from
# a GitHub release URL via `spacy download`, which breaks air-gapped and proxied
# installs, and because spaCy's thinc/numpy pins fight other dependencies.
deid-presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
# LLM providers. Layer 1 of the gate *is* these extras being absent: with the
# SDK missing, the most reliable gate available is an ImportError.
deid-anthropic = ["anthropic>=1.0"]
# Also covers Codex, vLLM, LM Studio, llama.cpp, Azure and internal gateways --
# anything that accepts a `base_url`.
deid-openai = ["openai>=1.40"]
deid-google = ["google-genai>=1.0"]
# Ollama deliberately has NO extra: plain HTTP over the httpx already in base
# dependencies above. The lowest-friction LLM path is also the zero-egress,
# zero-new-dependency one, which is the right incentive. Its containment is the
# acknowledgement's `allowed_endpoints` plus the egress classifier, not an
# install flag -- gating an install on a transport that reaches only loopback
# buys nothing.

# UNCHANGED, and it matters: CI runs `pip install -e ".[dev]"` then a bare
# `python -m pytest`, so no workflow edit is needed and no LLM SDK or model
# weight ever reaches CI. The model and live-LLM tests are skipped by the
# `pytest_collection_modifyitems` hook in tests/conftest.py, with a named
# reason rather than a silent zero-collected pass.
dev = ["pytest>=8.0", "ruff>=0.16.8"]

[project.scripts]
autocab = "autocab.cli:main"
wfrec = "wfrec.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Ship the usage guide with the package: an installed copy should carry its own
# documentation rather than requiring the repo to be at hand.
"wfrec" = ["README.md"]
# The shell hooks and the control UI are data files, not importable modules,
# and both must survive installation into a wheel.
"wfrec.hooks" = ["*.bash", "*.zsh", "*.fish", "*.ps1", "*.sh"]
"wfrec.ui" = ["*.html", "*.css", "*.js"]

[tool.setuptools.data-files]
"share/autocab/skill-forge" = [
  "skills/skill-forge/assets/cbd-skill.template.md",
  "skills/skill-forge/assets/evaluation-prompts.template.md",
  "skills/skill-forge/assets/record_run.py",
  "skills/skill-forge/assets/review.template.md",
  "skills/skill-forge/assets/run-summary.template.json",
  "skills/skill-forge/assets/runtime-reproducibility.template.md",
  "skills/skill-forge/assets/std-skill.template.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: needs the packaged de-identification model weights (AUTOCAB_DEID_MODEL_TESTS=1)",
  "live: sends text to a real LLM provider (AUTOCAB_DEID_LIVE_LLM_TESTS=1)",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "C420",
  "SIM102",
  "SIM103",
  "SIM105",
  "SIM114",
]
# Assigned lambdas keep small callbacks compact and readable in this project.
ignore = ["E731"]
