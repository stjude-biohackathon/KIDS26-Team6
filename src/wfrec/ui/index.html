<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wfrec</title>
<style>
  :root{
    --bg:#11131a; --panel:#181b24; --line:#262b38; --ink:#e7e9ee; --dim:#9aa3b2;
    --on:#3ddc97; --off:#4a5468; --warn:#f0a339; --accent:#6aa6ff;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f7f9; --panel:#fff; --line:#e2e5ea; --ink:#1a1d24; --dim:#5f6775; --off:#c3c9d4; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:16px;margin:0;letter-spacing:.02em}
  .sid{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--dim)}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);
         text-transform:uppercase;letter-spacing:.06em}
  .badge.active{background:color-mix(in srgb,var(--on) 18%,transparent);
                border-color:var(--on);color:var(--on)}
  .badge.paused{background:color-mix(in srgb,var(--warn) 18%,transparent);
                border-color:var(--warn);color:var(--warn)}
  main{padding:22px;display:grid;gap:18px;max-width:1000px}
  section{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
     margin:0 0 12px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button{font:inherit;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
          background:transparent;color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1020;font-weight:600}
  input,textarea{font:inherit;background:var(--bg);color:var(--ink);
                 border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
  textarea{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:13px}
  .sources{display:grid;gap:8px}
  .src{display:flex;align-items:center;justify-content:space-between;gap:12px;
       padding:9px 12px;border:1px solid var(--line);border-radius:8px}
  .src .meta{display:flex;flex-direction:column;gap:2px;min-width:0}
  .src .name{font-weight:600}
  .src .why{font-size:12px;color:var(--dim);overflow-wrap:anywhere}
  .toggle{flex:none;width:46px;height:26px;border-radius:999px;border:1px solid var(--line);
          background:var(--off);position:relative;cursor:pointer;transition:background .15s}
  .toggle[data-on="1"]{background:var(--on)}
  .toggle::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;
                 border-radius:50%;background:#fff;transition:transform .15s}
  .toggle[data-on="1"]::after{transform:translateX(20px)}
  .toggle[disabled]{opacity:.45;cursor:not-allowed}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stat{font:12px ui-monospace,Menlo,monospace;color:var(--dim)}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;
                gap:12px;margin-bottom:12px}
  .section-head h2{margin:0}
  .log-count{font-size:12px;color:var(--dim)}
  .event-log{max-height:320px;overflow:auto}
  .event-row{display:grid;grid-template-columns:82px minmax(0,1fr);gap:10px;
             padding:9px 0;border-top:1px solid var(--line);align-items:start}
  .event-row:first-child{border-top:0;padding-top:0}
  .event-time{font:12px ui-monospace,Menlo,monospace;color:var(--dim)}
  .event-title{font-weight:600}
  .event-detail{margin-top:2px;color:var(--dim);font-size:12px;overflow-wrap:anywhere}
  button.event-more{padding:0;border:0;border-radius:0;background:none;color:var(--accent);
                    font-size:inherit;font-weight:600;text-decoration:underline;
                    text-underline-offset:2px;vertical-align:baseline}
  button.event-more:hover{border-color:transparent}
  .event-row.warning .event-title{color:var(--warn)}
  .empty{margin:0;color:var(--dim);font-size:12px}
  .warn{color:var(--warn);font-size:12px}
  @media (max-width:640px){
    .grid2{grid-template-columns:1fr}
    .event-row{grid-template-columns:70px minmax(0,1fr)}
  }
</style>
</head>
<body>
<header>
  <h1>wfrec</h1>
  <span id="badge" class="badge">idle</span>
  <span class="sid" id="sid">no active session</span>
</header>

<main>
  <section>
    <h2>Session</h2>
    <div class="grid2" style="margin-bottom:12px">
      <input id="title" placeholder="What are you working on? e.g. HG008 variant calling">
      <input id="analyst" placeholder="Analyst id (for multi-analyst clustering)">
    </div>
    <div class="row">
      <button class="primary" onclick="act('start')">Start</button>
      <button onclick="pause()">Pause</button>
      <button onclick="act('resume')">Resume</button>
      <button onclick="act('stop')">Stop</button>
      <button onclick="doExport()">Export for AutoCAB</button>
    </div>
    <p class="stat" id="stats"></p>
  </section>

  <section>
    <h2>Capture sources</h2>
    <div class="sources" id="sources"></div>
    <p class="warn" id="warnings"></p>
  </section>

  <section>
    <h2>Pasted context</h2>
    <p class="stat">Paste or type anything worth remembering. Redaction runs before it is written to disk.</p>
    <textarea id="note" placeholder="Paste the error, the job script, the reason you reran this..."></textarea>
    <div class="row" style="margin-top:10px">
      <input id="label" placeholder="Optional label, e.g. 'why I reran this'" style="max-width:340px">
      <button class="primary" onclick="saveNote()">Add to timeline</button>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Recent Events Log</h2>
      <span class="log-count" id="log-count"></span>
    </div>
    <div class="event-log" id="log" aria-live="polite">
      <p class="empty">Start or resume a session to see activity.</p>
    </div>
  </section>
</main>

<script>
const TOKEN = new URLSearchParams(location.search).get('token') || '@WFREC_TOKEN@';
const H = {'Content-Type':'application/json','Authorization':'Bearer '+TOKEN};
const SOURCE_HELP = {
  screen:'Screenshots, OCR text and window titles',
  context:'Paste box and wfrec note (no clipboard watching)',
  shell:'Shell commands, exit codes and durations',
  agents:'Codex, Claude Code, Copilot and Cursor transcripts',
  files:'Git-verified file changes in declared roots'
};
const EVENT_NAMES = {
  'session.created':'Session created',
  'session.started':'Recording started',
  'session.paused':'Recording paused',
  'session.resumed':'Recording resumed',
  'session.stopped':'Recording stopped',
  'session.preempted':'Session switched',
  'session.waiting':'Waiting',
  'source.enabled':'Capture source enabled',
  'source.disabled':'Capture source disabled',
  'shell.command.completed':'Command completed',
  'screen.frame':'Screenshot captured',
  'screen.ocr':'Screen text captured',
  'screen.window':'Active window changed',
  'screen.recording.started':'Screen recording started',
  'screen.recording.stopped':'Screen recording stopped',
  'context.note':'Note added',
  'agent.message':'Agent message',
  'agent.adapter.failed':'Agent capture issue',
  'file.changed':'File changed',
  'file.diff':'File diff captured',
  'file.flood':'Large file change detected',
  'git.snapshot':'Git snapshot',
  'job.submitted':'Job submitted',
  'job.completed':'Job completed',
  'marker.user':'Marker added',
  'collector.error':'Capture issue'
};
const TOOL_NAMES = {
  codex:'Codex', 'devsql-codex':'Codex', 'claude-code':'Claude Code',
  copilot:'Copilot', cursor:'Cursor'
};
const EXPANDED_EVENTS = new Set();
let STATE = null;

async function api(path, body){
  const res = await fetch(path, {method: body?'POST':'GET', headers:H,
                                body: body?JSON.stringify(body):undefined});
  if(!res.ok){ const t = await res.text(); throw new Error(t || res.status); }
  return res.json();
}

function pastedFlag(el){ return el.dataset.pasted === '1'; }
document.getElementById('note').addEventListener('paste', e => {
  // Use the paste event rather than reading the clipboard: it needs no
  // permission, works in every webview, and only ever sees what the user
  // deliberately pasted into this box.
  e.currentTarget.dataset.pasted = '1';
});

async function act(kind){
  try{
    if(kind === 'start'){
      STATE = await api('/sessions/start', {
        title: document.getElementById('title').value,
        analyst: document.getElementById('analyst').value || 'unknown-analyst'
      });
    } else if(kind === 'resume'){ STATE = await api('/sessions/resume', {}); }
    else if(kind === 'stop'){ STATE = await api('/sessions/stop', {}); }
    render();
  }catch(e){ flash(e.message); }
}

async function pause(){
  const reason = prompt('Why are you pausing? (e.g. "waiting on the alignment job")') || '';
  try{ STATE = await api('/sessions/pause', {reason}); render(); }
  catch(e){ flash(e.message); }
}

async function toggle(name, on){
  try{ STATE = await api('/sources/'+name, {enabled:!on}); render(); }
  catch(e){ flash(e.message); }
}

async function saveNote(){
  const el = document.getElementById('note');
  const text = el.value.trim();
  if(!text) return;
  try{
    await api('/notes', {text, label:document.getElementById('label').value,
                         pasted:pastedFlag(el)});
    el.value=''; el.dataset.pasted='0'; document.getElementById('label').value='';
    refreshLog();
  }catch(e){ flash(e.message); }
}

async function doExport(){
  try{ const r = await api('/export', {formats:['autocab','trace']}); flash('Exported: '+ (r.written||[]).join(', ')); }
  catch(e){ flash(e.message); }
}

function flash(msg){ document.getElementById('warnings').textContent = msg; }

function sourceDetail(name, col){
  const extra = col.extra || {};
  const details = [];
  if(name === 'shell' && extra.provider) details.push('provider: '+extra.provider);
  if(name === 'agents' && extra.detected){
    const active = Object.entries(extra.detected)
      .filter(([, available]) => available)
      .map(([provider]) => provider);
    if(active.length) details.push('providers: '+active.join(', '));
  }
  if((extra.failed || []).length) details.push('failed: '+extra.failed.join(', '));
  if(col.reason) details.push('reason: '+col.reason);
  if(col.detail) details.push(col.detail);
  return details.join(' · ');
}

function render(){
  if(!STATE) return;
  const s = STATE.session;
  const badge = document.getElementById('badge');
  const status = s ? s.status : 'idle';
  badge.textContent = status;
  badge.className = 'badge ' + (status==='active'?'active':status==='paused'?'paused':'');
  document.getElementById('sid').textContent = s ? s.id : 'no active session';
  document.getElementById('stats').textContent = s
    ? `${s.events} events · active ${s.active_seconds}s · paused ${s.paused_seconds}s · ${s.root}`
    : '';
  if(!s) showEmptyLog('Start or resume a session to see activity.');

  const host = document.getElementById('sources');
  host.innerHTML = '';
  for(const [name, on] of Object.entries(STATE.sources || {})){
    const col = (STATE.collectors||{})[name] || {};
    const unavailable = col.available === false;
    const statusDetail = sourceDetail(name, col);
    const why = unavailable
      ? (statusDetail || 'unavailable')
      : [SOURCE_HELP[name], col.backend, statusDetail].filter(Boolean).join(' · ');
    const div = document.createElement('div');
    div.className = 'src';
    div.innerHTML = `<div class="meta"><span class="name">${name}</span>
                     <span class="why">${why}</span></div>`;
    const btn = document.createElement('button');
    btn.className='toggle'; btn.dataset.on = on ? '1':'0';
    btn.setAttribute('aria-label', (on?'Disable ':'Enable ')+name);
    btn.onclick = () => toggle(name, on);
    if(!s) btn.disabled = true;
    div.appendChild(btn);
    host.appendChild(div);
  }
}

async function refresh(){
  try{ STATE = await api('/status'); render(); }catch(e){}
}
async function refreshLog(){
  if(!STATE || !STATE.session){
    showEmptyLog('Start or resume a session to see activity.');
    return;
  }
  try{
    const r = await api(`/sessions/${STATE.session.id}/events?limit=14&offset=${Math.max(0,STATE.session.events-14)}`);
    const events = r.events || [];
    const host = document.getElementById('log');
    const total = Number(r.total || 0);
    document.getElementById('log-count').textContent = events.length
      ? `Latest ${events.length} of ${total} events`
      : '0 events';
    host.replaceChildren();
    if(!events.length){
      showEmptyLog('Waiting for recorded activity…');
      return;
    }
    for(const event of [...events].reverse()) host.appendChild(eventRow(event));
    host.scrollTop = 0;
  }catch(e){}
}

function showEmptyLog(message){
  const empty = document.createElement('p');
  empty.className = 'empty';
  empty.textContent = message;
  document.getElementById('log').replaceChildren(empty);
  document.getElementById('log-count').textContent = '';
}

function eventRow(event){
  const presentation = presentEvent(event);
  const row = document.createElement('div');
  row.className = 'event-row' + (presentation.warning ? ' warning' : '');

  const time = document.createElement('span');
  time.className = 'event-time';
  time.textContent = eventTime(event.ts);

  const main = document.createElement('div');
  main.className = 'event-main';
  const title = document.createElement('div');
  title.className = 'event-title';
  title.textContent = presentation.title;
  main.appendChild(title);
  if(presentation.detail){
    main.appendChild(eventDetail(event, presentation.detail, presentation.detailLimit));
  }
  row.append(time, main);
  return row;
}

function eventDetail(event, fullDetail, previewLimit){
  const detail = document.createElement('div');
  detail.className = 'event-detail';

  const normalizedDetail = normalizeText(fullDetail);
  const preview = cleanText(normalizedDetail, previewLimit);
  const text = document.createElement('span');
  text.textContent = preview;
  detail.appendChild(text);
  if(preview === normalizedDetail) return detail;

  const key = `${event.session || ''}:${event.seq ?? `${event.ts}:${event.type}`}`;
  const more = document.createElement('button');

  function renderDetail(){
    const expanded = EXPANDED_EVENTS.has(key);
    text.textContent = expanded ? normalizedDetail : preview;
    more.textContent = expanded ? 'Less' : 'More';
    more.setAttribute('aria-expanded', String(expanded));
  }

  more.type = 'button';
  more.className = 'event-more';
  more.onclick = () => {
    if(EXPANDED_EVENTS.has(key)) EXPANDED_EVENTS.delete(key);
    else EXPANDED_EVENTS.add(key);
    renderDetail();
  };
  detail.append(document.createTextNode(' '), more);
  renderDetail();
  return detail;
}

function presentEvent(event){
  const p = event.payload || {};
  let title = EVENT_NAMES[event.type] || readableEventName(event.type);
  let detail = '';
  let detailLimit = 180;

  if(event.type === 'agent.message'){
    const tool = TOOL_NAMES[p.tool] || cleanText(p.tool || 'Agent', 30);
    const role = titleCase(p.role || 'message');
    title = `${tool} · ${role}`;
    detail = joinDetails([normalizeText(p.text), branchDetail(p)]);
  } else if(event.type === 'shell.command.completed'){
    detailLimit = 150;
    detail = joinDetails([
      normalizeText(p.command),
      p.exit_code !== undefined && p.exit_code !== null ? `exit ${p.exit_code}` : '',
      durationDetail(p.duration_ms),
      pathTail(p.cwd)
    ]);
  } else if(event.type === 'file.changed'){
    title = `File ${p.op || 'changed'}`;
    detail = pathTail(p.path);
  } else if(event.type === 'file.diff'){
    detail = joinDetails([pathTail(p.path), changeDetail(p)]);
  } else if(event.type === 'git.snapshot'){
    detail = joinDetails([
      p.branch ? `branch ${p.branch}` : '',
      Number.isFinite(Number(p.changed_count)) ? `${p.changed_count} changed` : '',
      p.trigger ? `trigger: ${p.trigger}` : ''
    ]);
  } else if(event.type === 'screen.ocr'){
    detail = normalizeText(p.ocr_text);
  } else if(event.type === 'screen.window'){
    detail = joinDetails([normalizeText(p.app), normalizeText(p.window_title)]);
  } else if(event.type === 'screen.frame'){
    detail = joinDetails([
      p.index ? `frame ${p.index}` : '',
      p.width && p.height ? `${p.width}×${p.height}` : ''
    ]);
  } else if(event.type === 'context.note'){
    detail = joinDetails([normalizeText(p.label), normalizeText(p.text)]);
  } else if(event.type === 'marker.user'){
    detailLimit = 140;
    detail = joinDetails([normalizeText(p.label), normalizeText(p.detail)]);
  } else if(event.type === 'session.created'){
    detail = joinDetails([normalizeText(p.title), normalizeText(p.analyst)]);
  } else if(event.type === 'session.paused'){
    detail = joinDetails([
      normalizeText(p.reason),
      p.expect ? `expected wait: ${p.expect}` : ''
    ]);
  } else if(event.type === 'session.preempted'){
    detail = joinDetails([normalizeText(p.reason), normalizeText(p.preempted_by)]);
  } else if(event.type === 'session.waiting'){
    detail = joinDetails([normalizeText(p.reason), durationDetail(p.elapsed_ms)]);
  } else if(event.type === 'source.enabled' || event.type === 'source.disabled'){
    detail = normalizeText(p.source);
  } else if(event.type === 'job.submitted' || event.type === 'job.completed'){
    detail = joinDetails([
      p.job_id || p.JobID ? `job ${p.job_id || p.JobID}` : '',
      normalizeText(p.job_name || p.JobName),
      normalizeText(p.state || p.State)
    ]);
  } else if(event.type === 'agent.adapter.failed'){
    detailLimit = 160;
    detail = joinDetails([normalizeText(p.tool), normalizeText(p.error)]);
  } else if(event.type === 'collector.error'){
    detailLimit = 160;
    detail = joinDetails([normalizeText(p.stage), normalizeText(p.error)]);
  } else {
    detail = summarize(event);
  }

  if((event.redactions || []).length){
    detail = joinDetails([detail, `redacted: ${event.redactions.join(', ')}`]);
  }
  return {
    title,
    detail,
    detailLimit,
    warning: event.type === 'agent.adapter.failed' || event.type === 'collector.error'
  };
}

function summarize(e){
  const p = e.payload || {};
  if(p.command) return p.command.slice(0,70);
  if(p.path) return p.path.split('/').pop();
  if(p.window_title) return p.window_title.slice(0,60);
  if(p.text) return p.text.slice(0,60).replace(/\n/g,' ');
  if(p.ocr_text) return p.ocr_text.slice(0,60).replace(/\n/g,' ');
  if(p.label) return p.label;
  if(p.reason) return p.reason;
  return '';
}

function eventTime(value){
  const moment = new Date(value);
  if(Number.isNaN(moment.getTime())) return cleanText(value, 12);
  return moment.toLocaleTimeString([], {
    hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false
  });
}

function cleanText(value, limit=120){
  const text = normalizeText(value);
  return text.length > limit ? text.slice(0, limit - 1) + '…' : text;
}

function normalizeText(value){
  if(value === undefined || value === null) return '';
  return String(value).replace(/\s+/g, ' ').trim();
}

function titleCase(value){
  const text = cleanText(value, 40);
  return text ? text.charAt(0).toUpperCase() + text.slice(1) : '';
}

function readableEventName(value){
  return String(value || 'Event').split('.').map(titleCase).join(' · ');
}

function joinDetails(values){ return values.filter(Boolean).join(' · '); }

function pathTail(value){
  const parts = cleanText(value, 300).split(/[\\/]/).filter(Boolean);
  return parts.slice(-2).join('/');
}

function branchDetail(payload){
  return payload.git_branch ? `branch ${payload.git_branch}` : '';
}

function durationDetail(value){
  const milliseconds = Number(value);
  if(!Number.isFinite(milliseconds) || milliseconds < 0) return '';
  return milliseconds < 1000
    ? `${Math.round(milliseconds)} ms`
    : `${(milliseconds / 1000).toFixed(1)} s`;
}

function changeDetail(payload){
  const added = payload.added !== undefined ? `+${payload.added}` : '';
  const deleted = payload.deleted !== undefined ? `-${payload.deleted}` : '';
  return [added, deleted].filter(Boolean).join(' ');
}

refresh().then(refreshLog);
setInterval(refresh, 2000);
setInterval(refreshLog, 3000);
</script>
</body>
</html>
