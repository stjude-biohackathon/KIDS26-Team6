<svg xmlns="http://www.w3.org/2000/svg" width="960" height="649" viewBox="0 0 960 649" role="img" aria-labelledby="title desc">
  <title id="title">De-identification accuracy comparison</title>
  <desc id="desc">Grouped bars compare safe-record rate and full-coverage recall from zero to one.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#172033}.chart-title{font-size:18px;font-weight:700}.axis-title{font-size:13px;font-weight:600}.label{font-size:13px}.value{font-size:12px;font-weight:600}.legend{font-size:12px}.grid{stroke:#d8dee9}</style>
  <rect width="960" height="649" fill="#ffffff"/>
  <text class="chart-title" x="480.0" y="27" text-anchor="middle">PHI Redaction Accuracy</text>
  <text class="axis-title" x="560.0" y="637" text-anchor="middle">Full-coverage rate</text>
  <text class="axis-title" transform="translate(18 324.5) rotate(-90)" text-anchor="middle">Evaluation metric</text>
  <line class="grid" x1="250.0" y1="105" x2="250.0" y2="601"/>
  <text class="legend" x="250.0" y="96" text-anchor="middle">0.0</text>
