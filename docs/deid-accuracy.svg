  <text class="legend" x="746.0" y="96" text-anchor="middle">0.8</text>
  <line class="grid" x1="870.0" y1="105" x2="870.0" y2="601"/>
  <text class="legend" x="870.0" y="96" text-anchor="middle">1.0</text>
  <rect x="40" y="39" width="14" height="14" fill="#2563eb"/>
  <text class="legend" x="60" y="51">Regex</text>
  <rect x="340" y="39" width="14" height="14" fill="#f59e0b"/>
