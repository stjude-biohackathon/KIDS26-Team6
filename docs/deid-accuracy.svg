  <text class="label" x="45" y="134">Safe records</text>
  <rect x="250" y="116" width="470.9" height="22" fill="#2563eb" rx="3"/>
  <text class="value" x="727.9" y="132">0.759</text>
  <rect x="250" y="143" width="123.6" height="22" fill="#f59e0b" rx="3"/>
